              - href: notes/week-10-continuous-random-variables.qmd
                text: "10 — Continuous random variables"
              - href: notes/week-11-common-continuous-models.qmd
                text: "11 — Common continuous models"
              - href: notes/week-12-joint-distributions-and-dependence.qmd
