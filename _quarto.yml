        contents:
          - href: notes/index.qmd
            text: "Notes overview"
          - section: "Part I — Foundations of uncertainty (Wk 1–2)"
            contents:
              - href: notes/week-01-uncertainty-probability-models.qmd
                text: "1 — Uncertainty, probability & models"
              - href: notes/week-02-sample-spaces-events-rules.qmd
                text: "2 — Sample spaces, events & rules"
          - section: "Part II — Conditioning & Bayesian reasoning (Wk 3–5)"
            contents:
              - href: notes/week-03-conditional-probability.qmd
                text: "3 — Conditional probability"
              - href: notes/week-04-independence-and-information.qmd
                text: "4 — Independence & information"
              - href: notes/week-05-bayes-rule-and-updating.qmd
                text: "5 — Bayes' rule & updating"
          - section: "Part III — Counting & discrete random variables (Wk 6–9)"
